name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, ruby: '2.7' }
          - { os: ubuntu-24.04, ruby: '2.7.3' }
          - { os: ubuntu-24.04, ruby: '3.0' }
          - { os: ubuntu-24.04, ruby: '3.1' }
          - { os: ubuntu-26.04, ruby: '3.2' }
          - { os: ubuntu-26.04, ruby: '3.3' }
          - { os: ubuntu-26.04, ruby: '3.4' }
          - { os: ubuntu-26.04, ruby: '4.0' }
          - { os: ubuntu-26.04, ruby: ruby-head }
          - { os: ubuntu-26.04, ruby: jruby-head }
          - { os: ubuntu-26.04, ruby: truffleruby-head }
          - { os: macos-latest, ruby: '4.0' }
    runs-on: ${{ matrix.os }}
    env:
      CI: spec

    steps:
    - uses: actions/checkout@v6

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true

    - run: bundle exec rake
