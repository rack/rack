name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ruby:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - ruby-head
          - jruby-head
          - truffleruby-head
        include:
          - os: macos-latest
            ruby: '4.0'
          # Exact minimum version. Newer runner images only ship the latest patch release of each series.
          - os: ubuntu-24.04
            ruby: '2.7.3'
    runs-on: ${{matrix.os}}
    env:
      CI: spec

    steps:
    - uses: actions/checkout@v6

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true

    - run: bundle exec rake
