name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ruby:
          - '2.7'
          - '2.7.3'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - ruby-head
          - jruby-head
          - truffleruby-head
        include:
          - os: macos-latest
            ruby: '4.0'
    # ruby/setup-ruby has no Ruby < 3.2 for ubuntu-26.04, which ubuntu-latest now points to
    runs-on: ${{ matrix.os == 'ubuntu-latest' && contains(fromJSON('["2.7", "2.7.3", "3.0", "3.1"]'), matrix.ruby) && 'ubuntu-24.04' || matrix.os }}
    env:
      CI: spec

    steps:
    - uses: actions/checkout@v6

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true

    - run: bundle exec rake
